<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030807" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data: blob: pideck-bg: pideck-pet: https://cloudcache.tencent-cloud.com https://skillhub-1388575217.cos.accelerate.myqcloud.com; font-src 'self' data:; frame-src 'self' file: blob:; connect-src 'self' ws://127.0.0.1:* ws://localhost:* http://127.0.0.1:* http://localhost:* https://api.skillhub.cn"
    />
    <title></title>
    <style>
      /* NeoNisch 启动画面：独立于 #root，React 挂载后 is-ready（白→薄荷绿渐变 + 微放大）→ fade-out 移除。
         不依赖外部字体/图片（Logo A 为内联 SVG），保证首帧极快。 */
      /* 注意：reset 必须限定在 boot-overlay 内——全局 * 规则是无层级的，
         会压过 Tailwind @layer utilities 的所有间距工具类（#115 曾因此导致菜单/弹窗无内边距）。 */
      #boot-overlay, #boot-overlay * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        height: 100%;
        overflow: hidden;
        /* 深黑绿是 NeoNisch 的身份底色，启动画面不跟随系统深浅 */
        background: #030807;
      }

      #boot-overlay {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(circle at 50% 42%, #123b2e 0%, #071b16 42%, #030807 100%);
        transition: opacity 420ms cubic-bezier(0.22, 1, 0.36, 1), transform 420ms cubic-bezier(0.22, 1, 0.36, 1);
        will-change: opacity, transform;
      }
      #boot-overlay.fade-out {
        opacity: 0;
        transform: scale(1.16);
        pointer-events: none;
      }

      .boot-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        animation: boot-rise 520ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .boot-logo {
        position: relative;
        width: 84px;
        height: 84px;
        animation: boot-breathe 2.2s ease-in-out infinite;
      }
      /* Logo A 双层：白色单色呼吸 → is-ready 后切薄荷绿→翡翠绿渐变并微放大 */
      .boot-logo-layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        transition: opacity 500ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      .boot-logo-mono {
        opacity: 1;
      }
      .boot-logo-color {
        opacity: 0;
      }
      #boot-overlay.is-ready .boot-logo-mono {
        opacity: 0;
      }
      #boot-overlay.is-ready .boot-logo-color {
        opacity: 1;
      }
      #boot-overlay.is-ready .boot-logo {
        animation: none;
        transform: scale(1.08);
        transition: transform 500ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .boot-title {
        color: #e7f6ee;
        font-size: 20px;
        font-weight: 650;
        letter-spacing: 0.01em;
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        line-height: 1.2;
      }
      .boot-subtitle {
        color: #7fa99a;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.02em;
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        line-height: 1.3;
      }

      .boot-progress {
        width: 120px;
        height: 3px;
        border-radius: 999px;
        background: rgba(184, 255, 208, 0.12);
        overflow: hidden;
        animation: boot-rise 520ms cubic-bezier(0.22, 1, 0.36, 1) 80ms both;
      }
      .boot-progress-bar {
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #b8ffd0, #1cb67a);
        animation: boot-progress 1.15s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes boot-rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes boot-breathe {
        0%, 100% { transform: scale(0.96); opacity: 0.88; }
        50% { transform: scale(1); opacity: 1; }
      }
      @keyframes boot-progress {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(280%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-brand,
        .boot-progress,
        .boot-logo,
        .boot-progress-bar {
          animation: none !important;
        }
        #boot-overlay {
          transition-duration: 120ms;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- 启动画面覆盖层：is-ready（白→绿渐变）后 fade-out 淡出，再由 main.tsx 移除 -->
    <div id="boot-overlay">
      <div class="boot-brand">
        <div class="boot-logo">
          <!--
            NeoNisch Logo A（官方几何，同 neonisch_logo_A_white_transparent）
            evenodd 复合路径：外轮廓实心 → 中菱形挖空 → 内菱形实心 → 圆心挖空
          -->
          <svg class="boot-logo-layer boot-logo-mono" viewBox="-60 -60 120 120" aria-hidden="true">
            <path
              fill="#FFFFFF"
              fill-rule="evenodd"
              d="M-48 22 L-28 -20 L-18 -52 L0 -18 L18 -52 L28 -20 L48 22 L0 52 Z
                 M0 -38 L20 -2 L0 34 L-20 -2 Z
                 M0 -30 L13 -4 L0 24 L-13 -4 Z
                 M9 0 A9 9 0 1 1 -9 0 A9 9 0 1 1 9 0 Z"
            />
          </svg>
          <svg class="boot-logo-layer boot-logo-color" viewBox="-60 -60 120 120" aria-hidden="true">
            <defs>
              <linearGradient id="neoBootGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#b8ffd0"/>
                <stop offset="44%" stop-color="#67e7a0"/>
                <stop offset="72%" stop-color="#1cb67a"/>
                <stop offset="100%" stop-color="#08704e"/>
              </linearGradient>
            </defs>
            <path
              fill="url(#neoBootGrad)"
              fill-rule="evenodd"
              d="M-48 22 L-28 -20 L-18 -52 L0 -18 L18 -52 L28 -20 L48 22 L0 52 Z
                 M0 -38 L20 -2 L0 34 L-20 -2 Z
                 M0 -30 L13 -4 L0 24 L-13 -4 Z
                 M9 0 A9 9 0 1 1 -9 0 A9 9 0 1 1 9 0 Z"
            />
          </svg>
        </div>
        <strong class="boot-title">NeoNisch</strong>
        <span class="boot-subtitle">正在启动工作台…</span>
      </div>
      <div class="boot-progress" aria-hidden="true">
        <div class="boot-progress-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
